name: Native Builds

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    name: Linux native jgrep
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v3

      - name: Build release binary
        run: cargo build --release -p jgrep

      - name: Smoke test
        run: |
          target/release/jgrep --version
          printf '%s\n' '{"name":"Alice"}' | target/release/jgrep '.name'
          printf 'service:\n  name: checkout\n' | target/release/jgrep '.service.name'
          target/release/jgrep completion bash | grep -- '--from-file'

      - name: Prepare release asset
        run: |
          mkdir -p target/dist
          cp target/release/jgrep target/dist/jgrep
          chmod +x target/dist/jgrep

      - name: Upload Linux native executable
        uses: actions/upload-artifact@v6
        with:
          name: jgrep-linux-x64
          path: target/dist/jgrep
          if-no-files-found: error

  macos-native:
    name: macOS native jgrep (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            artifact: jgrep-macos-arm64
          - runner: macos-15-intel
            arch: x64
            artifact: jgrep-macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v3

      - name: Build release binary
        run: cargo build --release -p jgrep

      - name: Smoke test
        run: |
          target/release/jgrep --version
          printf '%s\n' '{"name":"Alice"}' | target/release/jgrep '.name'
          printf 'service:\n  name: checkout\n' | target/release/jgrep '.service.name'

      - name: Package native executable
        run: |
          mkdir -p target/dist
          cp target/release/jgrep target/dist/jgrep
          chmod +x target/dist/jgrep
          tar -czf target/dist/${{ matrix.artifact }}.tar.gz -C target/dist jgrep

      - name: Upload native executable
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: target/dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [linux-native, macos-native]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "*-linux-x64"
          path: release-assets/binaries
          merge-multiple: true

      - name: Download macOS archives
        uses: actions/download-artifact@v8
        with:
          pattern: "*-macos-*"
          path: release-assets/archives
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ls -lR release-assets
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/binaries/* release-assets/archives/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/binaries/* release-assets/archives/* \
              --title "$TAG_NAME" --generate-notes --verify-tag
          fi
