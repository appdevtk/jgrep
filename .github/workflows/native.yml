name: Native Builds

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gate
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  linux-native:
    name: Linux native jgrep
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        run: cargo build --locked --release -p jgrep

      - name: Smoke test
        run: |
          target/release/jgrep --version
          printf '%s\n' '{"name":"Alice"}' | target/release/jgrep '.name'
          printf 'service:\n  name: checkout\n' | target/release/jgrep '.service.name'
          target/release/jgrep completion bash | grep -- '--from-file'

      - name: Prepare release asset
        run: |
          mkdir -p target/dist
          cp target/release/jgrep target/dist/jgrep
          chmod +x target/dist/jgrep

      - name: Upload Linux native executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jgrep-linux-x64
          path: target/dist/jgrep
          if-no-files-found: error

  macos-native:
    name: macOS native jgrep (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            artifact: jgrep-macos-arm64
          - runner: macos-15-intel
            arch: x64
            artifact: jgrep-macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        run: cargo build --locked --release -p jgrep

      - name: Smoke test
        run: |
          target/release/jgrep --version
          printf '%s\n' '{"name":"Alice"}' | target/release/jgrep '.name'
          printf 'service:\n  name: checkout\n' | target/release/jgrep '.service.name'

      - name: Package native executable
        run: |
          mkdir -p target/dist
          cp target/release/jgrep target/dist/jgrep
          chmod +x target/dist/jgrep
          tar -czf target/dist/${{ matrix.artifact }}.tar.gz -C target/dist jgrep

      - name: Upload native executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: target/dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [quality, linux-native, macos-native]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "jgrep-*"
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum jgrep jgrep-macos-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ls -lR release-assets
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/jgrep* release-assets/SHA256SUMS --clobber
          else
            gh release create "$TAG_NAME" release-assets/jgrep* release-assets/SHA256SUMS \
              --title "$TAG_NAME" --generate-notes --verify-tag
          fi
