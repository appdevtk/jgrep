[package]
name = "jgrep"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "jgrep"

[features]
default = ["full"]
full = ["completion", "explore", "yaml"]
minimal = []
completion = ["jgrep-core/completion"]
explore = ["jgrep-core/explore"]
yaml = ["jgrep-core/yaml"]

[dependencies]
jgrep-core = { path = "../jgrep-core", default-features = false }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[[bench]]
name = "compare"
harness = false

[dev-dependencies.criterion]
workspace = true
