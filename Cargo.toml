[workspace]
members = [
    "crates/jgrep-core",
    "crates/jgrep",
]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
assert_cmd = "2.1.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.1"
criterion = "0.7.0"
jaq-core = "3.1.0"
jaq-json = { version = "2.0.1", features = ["serde"] }
jaq-std = "3.0.1"
predicates = "3.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.24.0"
walkdir = "2.5.0"
yaml_serde = "0.10.4"
