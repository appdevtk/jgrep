[workspace]
members = [
    "crates/jgrep-core",
    "crates/jgrep",
]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
criterion = "0.8.2"
jaq-core = "3.1.1"
jaq-json = "2.0.3"
jaq-std = "3.0.3"
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
walkdir = "2.5.0"
yaml_serde = "0.10.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
